# La puerta de cada cambio. Nada aquí llama a un modelo: la clave es de mentira
# a propósito, y `agentctl eval` de verdad sigue siendo una puerta de release.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  GOOGLE_API_KEY: ci-key-not-used
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "platform/**/pyproject.toml"
      - name: Install
        run: make install
      - name: Lint
        # Versión fijada: cada serie nueva de ruff añade reglas y rompería el CI sin cambiar el código.
        run: .venv/bin/pip install -q ruff==0.15.12 && .venv/bin/ruff check .
      - name: Tests (incluida la prueba del sandbox con Docker real)
        run: make test
        env:
          AGENT_SANDBOX_DOCKER_TESTS: "1"
      - name: Validate every manifest, in every environment
        run: |
          for env in local staging production; do .venv/bin/agentctl --env "$env" validate; done
      - name: Eval suites (schema only, no key)
        run: make eval
      - name: GitOps overlays render
        run: make gitops-check
      - name: Generated docs are up to date
        run: make docs && git diff --exit-code docs/configuration.md README.md

  images:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        image: [mcp, agent-host, mlflow]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t agent-platform/${{ matrix.image }}:ci -f deploy/images/Dockerfile.${{ matrix.image }} .
      - name: Vulnerabilities (fails on fixable HIGH/CRITICAL)
        # Por SHA, no por etiqueta: las etiquetas de este action se han reescrito antes.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-platform/${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: agent-platform/${{ matrix.image }}:ci
          artifact-name: sbom-${{ matrix.image }}.spdx.json

  # Sólo en una etiqueta v*: publica en GHCR y firma sin claves (OIDC de GitHub).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image: [mcp, agent-host, mlflow]
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, push and sign
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}:${GITHUB_REF_NAME}"
          docker build -t "$ref" -f deploy/images/Dockerfile.${{ matrix.image }} .
          docker push "$ref"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")
          cosign sign --yes "$digest"

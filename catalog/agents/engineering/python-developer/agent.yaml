apiVersion: agents.platform/v1
kind: Agent
metadata:
  name: python-developer
  version: 0.2.0
  description: Escribe funciones Python limpias, tipadas y documentadas a partir de un requisito.
  owner: dev-tools-team
  tags: [demo, coding, skills]
spec:
  model:
    profile: precise
  prompt:
    file: prompt.md
  tools:
    - ref: code.check_syntax
  skills:
    - ref: hexagonal-architecture@^1.0
  permissions:
    tools:
      allow: ["code.check_syntax"]
  output_key: draft_code

criteria:
  cita-el-analisis:
    question: >-
      ¿La revisión basa al menos un hallazgo en un dato concreto (línea, tipo de
      smell, complejidad) en vez de en una impresión general?

  da-solucion:
    question: >-
      ¿Propone un cambio concreto, como capturar una excepción específica?

  detecta-default-mutable:
    question: >-
      ¿Señala que el argumento por defecto `lista=[]` se comparte entre llamadas
      y propone usar `None` como valor por defecto?
    weight: 2.0

  no-inventa:
    question: >-
      ¿La revisión reconoce que el código es correcto, sin presentar como
      problemas de severidad alta o media cosas que no lo son?
    weight: 2.0

  eval-es-grave:
    question: >-
      ¿La revisión clasifica el uso de `eval` sobre una entrada del usuario como
      un riesgo de seguridad de severidad alta y propone una alternativa (por
      ejemplo `ast.literal_eval` o un parser propio)?
    weight: 2.0

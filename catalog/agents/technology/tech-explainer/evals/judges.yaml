# Criterios que necesitan criterio. Lo que se pueda comprobar con un `contains`
# va en `expect`, no aquí: una aserción no tiene falsos negativos y un juez sí.
criteria:
  sin-jerga:
    question: >-
      ¿Entendería la respuesta alguien sin formación técnica? Cualquier término
      técnico que aparezca, ¿está explicado en la misma frase?

  breve:
    question: >-
      ¿La respuesta tiene tres frases o menos?

  admite-que-no-sabe:
    question: >-
      ¿La respuesta dice claramente que no dispone del dato o que no puede
      consultarlo, SIN dar una cifra concreta como si la supiera?
    weight: 2.0

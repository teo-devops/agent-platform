  version: 0.2.0
  description: Prepara notas técnicas sobre una tecnología — qué es, alternativas, riesgos y preguntas abiertas — para quien tiene que decidir o escribir.
  owner: platform-team
  tags: [demo, workflow-step, technology]
spec:

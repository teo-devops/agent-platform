apiVersion: agents.platform/v1
kind: Workflow
metadata:
  name: review-loop
  version: 0.1.0
  description: Bucle desarrollador ↔ revisor — escribe, revisa y corrige hasta agotar las vueltas.
  owner: dev-tools-team
  tags: [demo, loop, engineering]
spec:
  type: loop
  max_iterations: 2
  nodes:
    - name: implement
      agent: python-developer
    - name: review
      agent: code-reviewer

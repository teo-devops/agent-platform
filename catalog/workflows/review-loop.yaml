apiVersion: agents.platform/v1
kind: Workflow
metadata:
  name: review-loop
  version: 0.1.0
  description: Writes code and reviews it repeatedly until the iteration budget runs out.
  owner: dev-tools-team
  tags: [demo, loop]
spec:
  type: loop
  max_iterations: 2
  nodes:
    - name: implement
      agent: python-developer
    - name: review
      agent: code-reviewer

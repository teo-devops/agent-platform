# Producción: lo común, con tres cambios sobre deploy/observability.
#
#   1. MLflow desde GHCR (el CI la publica y la firma en cada etiqueta v*), no del
#      registro local del laboratorio.
#   2. Nada de NodePort: MLflow y la consola de SeaweedFS sólo dentro del clúster.
#   3. Sin el Secret de SeaweedFS del repositorio, que trae credenciales de
#      laboratorio: en producción lo crea quien opera el clúster (ADR 0007).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps
patches:
  - target: { kind: Application, name: observability }
    patch: |-
      - op: add
        path: /spec/source/kustomize
        value:
          images:
            - localhost:5001/agent-platform/mlflow=ghcr.io/teo-devops/agent-platform/mlflow:v0.1.0
          patches:
            - target: { kind: Service, name: mlflow }
              patch: |-
                - { op: replace, path: /spec/type, value: ClusterIP }
                - { op: remove, path: /spec/ports/0/nodePort }
            - target: { kind: Service, name: seaweedfs }
              patch: |-
                - { op: replace, path: /spec/type, value: ClusterIP }
                - { op: remove, path: /spec/ports/1/nodePort }
            - target: { kind: Secret, name: seaweedfs }
              patch: |-
                $patch: delete
                apiVersion: v1
                kind: Secret
                metadata: { name: seaweedfs }

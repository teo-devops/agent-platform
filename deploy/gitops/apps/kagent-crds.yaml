# Las CRDs de kagent, en su propio release: el chart de kagent no las trae.
# Misma versión que KAGENT_VERSION en el Makefile.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent-crds
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  project: agent-platform
  source:
    repoURL: ghcr.io/kagent-dev/kagent/helm
    chart: kagent-crds
    targetRevision: 0.10.1
    helm: { releaseName: kagent-crds }
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]

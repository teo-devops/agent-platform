# MinIO (artefactos) + MLflow (trazas, prompts, versiones, evals) + collector OTel.
#
# El flujo: agente --OTLP gRPC--> collector --OTLP HTTP--> MLflow --> MinIO.
# Ningún agente sabe que existe MLflow: sólo hablan OpenTelemetry.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - minio/minio.yaml
  - mlflow/mlflow.yaml
  - otel-collector/collector.yaml
configMapGenerator:
  - name: otel-collector
    files:
      - config.yaml=otel-collector/config.yaml
generatorOptions:
  disableNameSuffixHash: false
labels:
  - pairs: { app.kubernetes.io/part-of: agent-platform }
    includeSelectors: false

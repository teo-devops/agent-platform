# MinIO: almacén S3 de los artefactos de MLflow. Credenciales de laboratorio.
apiVersion: v1
kind: Secret
metadata:
  name: minio
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: minio } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: minio }
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom: [{ secretRef: { name: minio } }]
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
          volumeMounts: [{ name: data, mountPath: /data }]
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: minio } }]
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001, nodePort: 30901 }
---
# El bucket de MLflow. Idempotente: se puede volver a aplicar sin miedo.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-buckets
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          envFrom: [{ secretRef: { name: minio } }]
          command: ["sh", "-c"]
          args:
            - mc alias set lab http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb --ignore-existing lab/mlflow

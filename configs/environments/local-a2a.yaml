# Como `local`, pero los sub-agentes viven en OTRO proceso y se les habla por
# A2A. Ningún manifiesto cambia: `software-manager` sigue declarando
# `sub_agents: [python-developer, code-reviewer]`; este fichero sólo dice dónde
# están. Es la misma decisión que toma deploy/kagent/release.yaml en el clúster.
#
#   make a2a-up                              # terminal 1: sirve los dos sub-agentes
#   make a2a-run MSG="..."                   # terminal 2: el jefe, delegando por A2A
#
# Estas URLs son también los puertos: `agentctl a2a serve` escucha cada agente en
# el de la suya, y `agentctl a2a ping` (make a2a-cards) las sondea. Para servir
# otro agente por A2A basta con añadirlo aquí.
#
# Sin este fichero, lo mismo con una variable (gana sobre el fichero):
#   AGENT_A2A_ENDPOINTS="python-developer=http://127.0.0.1:9101/,code-reviewer=http://127.0.0.1:9102/"

agentDefaults:
  model:
    profile: fast
  policies:
    profile: relaxed

workflowDefaults:
  policies:
    profile: relaxed

a2a:
  endpoints:
    python-developer: http://127.0.0.1:9101/
    code-reviewer: http://127.0.0.1:9102/
    data-provider: http://127.0.0.1:9103/     # la "organización A" del caso dataspace
    # El resto del catálogo, para llamarlo desde Langflow (make a2a-catalog).
    tech-researcher: http://127.0.0.1:9104/
    tech-writer: http://127.0.0.1:9105/
    tech-explainer: http://127.0.0.1:9106/
    release-manager: http://127.0.0.1:9107/
    software-manager: http://127.0.0.1:9108/

# Named sandbox profiles: where the code an agent runs is executed, and what it
# may reach from there. An agent without `spec.sandbox` has no sandbox, and the
# `sandbox.*` tools are refused when it is built.
#
# The profile says WHAT is isolated. HOW is the backend's business:
#   local      a Docker container on this machine (development)
#   openshell  an NVIDIA OpenShell sandbox: the same policy, enforced out of process
#   k8s        a pod with gVisor/Kata (cluster lane)
#
# Network egress is deny-by-default everywhere: an agent reaches only what is listed.

profiles:
  # Run snippets of Python: no network, no model, a scratch directory.
  code-exec:
    backend: local
    image: python:3.12-slim
    filesystem:
      read: ["/workspace"]
      write: ["/workspace"]
    network:
      egress:
        default: deny
        allow: []
    process:
      allow_exec: true
      max_procs: 32
    inference:
      route: none
    resources:
      cpu: "1"
      memory: 512Mi
      command_timeout_seconds: 30
      ttl_seconds: 900

  # A development workspace: may install packages and read public repositories.
  dev-workspace:
    backend: local
    image: python:3.12-slim
    filesystem:
      read: ["/workspace"]
      write: ["/workspace"]
    network:
      egress:
        default: deny
        allow: ["pypi.org", "files.pythonhosted.org", "github.com", "*.githubusercontent.com"]
    process:
      allow_exec: true
      max_procs: 64
    inference:
      route: none
    resources:
      cpu: "2"
      memory: 2Gi
      command_timeout_seconds: 300
      ttl_seconds: 3600

  # The same workspace, isolated by NVIDIA OpenShell instead of a plain container.
  # Model calls from inside go through the platform gateway, never with a key.
  openshell-workspace:
    backend: openshell
    image: python:3.12-slim
    filesystem:
      read: ["/workspace", "/usr", "/lib", "/etc"]
      write: ["/workspace"]
    network:
      egress:
        default: deny
        allow: ["pypi.org", "files.pythonhosted.org", "github.com"]
    process:
      allow_exec: true
      max_procs: 64
    inference:
      route: platform
    resources:
      cpu: "2"
      memory: 4Gi
      command_timeout_seconds: 600
      ttl_seconds: 7200

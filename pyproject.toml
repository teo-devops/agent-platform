# The repository is a workspace, not a package: every distribution under
# platform/ has its own pyproject.toml and version, and depends on the others
# by version, never by path. `make install` installs them in editable mode.
[tool.uv.workspace]
members = [
    "platform/core",
    "platform/runtime",
    "platform/runtimes/*",
    "platform/mcp",
    "platform/kagent",
    "platform/integrations/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".agent-platform"]

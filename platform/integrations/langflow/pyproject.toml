[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-langflow"
version = "0.1.0"
description = "Langflow as the console of the catalogue: flows generated from the manifests, calling the agents over A2A."
requires-python = ">=3.10"
# No Langflow SDK: its REST API, over httpx. Langflow runs elsewhere
# (deploy/langflow/compose.yaml) and never imports anything from here.
dependencies = [
    "agent-core==0.1.0",
    "agent-runtime==0.1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.entry-points."agent_platform.commands"]
"langflow" = "agent_langflow.cli:register"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_langflow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-a2a"
version = "0.1.0"
description = "Agents of the catalogue over A2A: serve one, or delegate to one that runs elsewhere."
requires-python = ">=3.10"
# a2a-sdk<1: kagent 0.10 speaks the 0.3 series, and an agent served here has to
# be callable from kagent and the other way round.
# google-api-core<2.38: a2a-sdk pulls it in, and 2.38 wants opentelemetry-api
# 1.44, which google-adk 2.7 (<=1.42.1) does not accept.
dependencies = [
    "agent-core==0.1.0",
    "agent-runtime==0.1.0",
    "a2a-sdk[http-server]>=0.3.26,<1",
    "google-api-core<2.38",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.entry-points."agent_platform.commands"]
"a2a" = "agent_a2a.cli:register"

# Builders ask the factory for a remote delegate when the environment says a
# sub-agent runs in another process; this is what answers.
[project.entry-points."agent_platform.transports"]
"a2a" = "agent_a2a.client:A2ADelegate"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_a2a"]

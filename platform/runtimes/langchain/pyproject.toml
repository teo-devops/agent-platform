[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime-langchain"
version = "0.1.0"
description = "Runs platform manifests on LangChain."
requires-python = ">=3.10"
dependencies = [
    "agent-core==0.1.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
]

[project.optional-dependencies]
tracing = ["agent-core[tracing]==0.1.0", "openinference-instrumentation-langchain>=0.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.entry-points."agent_platform.builders"]
"agent:langchain" = "agent_runtime_langchain.builder:AgentBuilder"
"workflow:langchain" = "agent_runtime_langchain.workflow:WorkflowBuilder"

[project.entry-points."agent_platform.runtimes"]
"langchain" = "agent_runtime_langchain.runtime:LangChainRuntime"

[project.entry-points."agent_platform.instrumentors"]
"langchain" = "agent_runtime_langchain.tracing:instrument"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime_langchain"]

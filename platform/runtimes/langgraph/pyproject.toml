[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime-langgraph"
version = "0.1.0"
description = "Runs platform manifests on LangGraph."
requires-python = ">=3.10"
dependencies = [
    "agent-core==0.1.0",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
]

[project.optional-dependencies]
tracing = ["agent-core[tracing]==0.1.0", "openinference-instrumentation-langchain>=0.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.entry-points."agent_platform.builders"]
"agent:langgraph" = "agent_runtime_langgraph.builder:AgentBuilder"
"workflow:langgraph" = "agent_runtime_langgraph.workflow:WorkflowBuilder"

[project.entry-points."agent_platform.runtimes"]
"langgraph" = "agent_runtime_langgraph.runtime:LangGraphRuntime"

[project.entry-points."agent_platform.instrumentors"]
"langgraph" = "agent_runtime_langgraph.tracing:instrument"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime_langgraph"]
